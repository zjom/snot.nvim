name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim_version: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ripgrep
      - uses: lumen-oss/nvim-busted-action@v1
        with:
          nvim_version: ${{ matrix.nvim_version }}
